version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rj-karan/AegisFlow
