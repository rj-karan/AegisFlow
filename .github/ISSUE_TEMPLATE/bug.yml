name: Bug report
description: Something is broken
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: bash
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
